<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | The Crusty Crab</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="bar"><div class="wrap bar-in">
<a class="back" href="customise.html">← Back</a><span class="bar-title">US-03 / US-04 Checkout Suite</span>
<a class="btn green" href="feedback.html">Complete →</a></div></header>
<main class="wrap"><section class="panel" style="margin:48px auto;max-width:900px">
<div class="between"><div><span class="eyebrow">Secure order processing</span><h2>Fulfillment &amp; Secure Payment</h2></div><span class="badge b-green" style="cursor:default">🔒 256-Bit SSL Encrypted</span></div>
<div class="two"><div><p class="label" style="margin-top:0">1. Fulfillment method (US-03)</p>
<div class="opts" style="grid-template-columns:1fr 1fr" data-group data-fulfil>
<button class="opt on" data-fee="Free"><b>Collection</b><small>Montgomery Park Store (Free)</small></button>
<button class="opt" data-fee="R 50.00"><b>Delivery</b><small>Randburg Area (+R 50.00)</small></button></div>
<p class="lead" style="margin-top:16px">Fulfilment fee: <b id="fee">Free</b></p></div>
<form class="panel" action="feedback.html" style="background:#fff"><h3 style="margin-bottom:14px">Payment Gateway (US-04)</h3>
<label class="field">Cardholder Name<input placeholder="John Smith" required></label>
<label class="field">Card Number or Instant EFT Token<input placeholder="4000 1234 5678 9010" inputmode="numeric" required></label>
<div class="cols"><label class="field"><input placeholder="MM / YY" required></label><label class="field"><input placeholder="CVC" required></label></div>
<button class="btn green block">Authorize payment &amp; generate receipt</button></form></div></section></main>
<script src="js/main.js"></script>
</body>
</html>
